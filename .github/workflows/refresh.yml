name: Daily refresh

on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC (6:17 am Eastern)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write        # needed so the job can push the snapshot branch
  pull-requests: write   # needed so the job can open the snapshot pull request

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's snapshots
        run: |
          python src/fetch_rates.py
          python src/fetch_currency_names.py

      - name: Write summary
        continue-on-error: true   # a model failure must never block the snapshot commit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_KEY }}
        run: python src/summary.py

      - name: Open snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data data
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          DAY="$(date -u +%F)"
          BRANCH="data/daily-snapshot-$DAY"
          git checkout -b "$BRANCH"
          git commit -m "Daily snapshot $DAY"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Daily snapshot $DAY" \
              --body "Automated currency snapshot for $DAY."
          else
            echo "PR already open for $BRANCH"
          fi

          # Queue the PR so it merges itself once any required checks pass.
          # Needs "Allow auto-merge" turned on in the repo settings.
          gh pr merge --auto --squash "$BRANCH"
